version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mockkey123456}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mocksecret987654321}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DRY_RUN=${DRY_RUN:-true}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-4}
    volumes:
      - ./data:/app/data
      - ./sequencer.db:/app/sequencer.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
